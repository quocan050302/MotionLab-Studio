[project]
name = "motionlab-ai-ml01"
version = "0.1.0"
description = "MotionLab AI (ML-01) — Zero-API Automatic Video Effects Engine (based on browser-use/video-use)"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0,<3",
    "pillow>=11.0",
    "opencv-python-headless>=4.10,<5",
    "scipy>=1.14",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
legacy = [
    "requests",
    "librosa",
    "matplotlib",
]
animations = ["manim"]

[project.scripts]
motionlab = "motionlab.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["motionlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
