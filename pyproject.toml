[project]
name = "motionlab-ai"
version = "0.1.0"
description = "MotionLab-AI ML-01: Zero-API local automatic video effects engine (forked from browser-use/video-use)"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2.3",
    "pillow>=10.0",
    "opencv-python-headless>=4.10,<5.0",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
legacy-cloud = [
    "requests>=2.31",
    "librosa>=0.10",
    "matplotlib>=3.8",
]
animations = ["manim"]

[project.scripts]
motionlab = "motionlab.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["motionlab*"]

[tool.setuptools.package-data]
motionlab = ["presets/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
